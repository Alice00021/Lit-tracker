networks:
  monitoring:
    driver: bridge
  lit-tracker:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lit_tracker}
  REDIS_URL: redis://redis:6379/0
  # Ollama на хосте по умолчанию; свой адрес задаётся в .env (OLLAMA_BASE_URL)
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  HOST: 0.0.0.0
  PORT: 8001
  RELOAD: "false"

services:
  # ============ Миграции БД (одноразово, до запуска app) ============
  migrate:
    build:
      context: ..
      dockerfile: lit-tracker/Dockerfile
    container_name: lit-tracker-migrate
    restart: "no"
    # миграции -> таблицы чекпоинтера LangGraph -> демо-пользователи
    # (пока нет авторизации, роуты работают от user_id=1; seed идемпотентный)
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.setup_checkpointer && python -m scripts.seed"]
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lit-tracker

  # ============ App instance 1 ============
  app1:
    build:
      context: ..
      dockerfile: lit-tracker/Dockerfile
    container_name: lit-tracker-app1
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - lit-tracker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============ App instance 2 ============
  app2:
    build:
      context: ..
      dockerfile: lit-tracker/Dockerfile
    container_name: lit-tracker-app2
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - lit-tracker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============ Nginx ============
  nginx:
    image: nginx:alpine
    container_name: lit-tracker-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - lit-tracker

  # ============ PostgreSQL ============
  postgres:
    image: pgvector/pgvector:pg15
    container_name: lit-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lit_tracker}
    ports:
      - "127.0.0.1:5433:5432"   # только с этой машины
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lit-tracker

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: lit-tracker-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"   # только с этой машины
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lit-tracker

  # ============ Prometheus ============
  prometheus:
    image: prom/prometheus:latest
    container_name: lit-tracker-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring
      - lit-tracker   # чтобы скрейпить app1/app2 по имени

  # ============ Grafana ============
  grafana:
    image: grafana/grafana:latest
    container_name: lit-tracker-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring