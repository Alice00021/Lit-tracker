networks:
  monitoring:
    driver: bridge
  lit-tracker:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

services:
  # ============ App instance 1 ============
  app1:
    build:
      context: ..
      dockerfile: lit-tracker/Dockerfile
    container_name: lit-tracker-app1
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lit_tracker
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://192.168.1.100:11434
      HOST: 0.0.0.0
      PORT: 8001
      RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lit-tracker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============ App instance 2 ============
  app2:
    build:
      context: ..
      dockerfile: lit-tracker/Dockerfile
    container_name: lit-tracker-app2
    restart: unless-stopped
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/lit_tracker
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://192.168.1.100:11434
      HOST: 0.0.0.0
      PORT: 8001
      RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lit-tracker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============ Nginx ============
  nginx:
    image: nginx:alpine
    container_name: lit-tracker-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - lit-tracker

  # ============ PostgreSQL ============
  postgres:
    image: pgvector/pgvector:pg15
    container_name: lit-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lit_tracker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lit-tracker

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: lit-tracker-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lit-tracker

  # ============ Prometheus ============
  prometheus:
    image: prom/prometheus:latest
    container_name: lit-tracker-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - monitoring

  # ============ Grafana ============
  grafana:
    image: grafana/grafana:latest
    container_name: lit-tracker-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring