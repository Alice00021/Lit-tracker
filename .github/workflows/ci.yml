name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check app/ --output-format=github

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install common-service
        run: |
          cd ../common-service 2>/dev/null || git clone https://github.com/${{ github.repository_owner }}/common-service.git ../common-service
          cd ../common-service
          pip install -e .

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run unit tests
        env:
          SERVICE_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lit_tracker
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-32-characters-long!!!
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=term-missing

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout lit-tracker
        uses: actions/checkout@v4
        with:
          path: lit-tracker

      - name: Checkout common-service
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/common-service
          path: common-service

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: lit-tracker/Dockerfile
          push: false
          tags: lit-tracker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max